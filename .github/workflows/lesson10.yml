name: lesson10-delivery

# 第10课单一流水线：同一提交 → 并列双门禁 → 两者全绿 → 构建并扫描镜像。
# 安全门禁需要运行中的容器才能完成密钥扫描范围，因此该 job 用临时 .env 启动测试栈；
# 测试栈镜像只是门禁环境，不是可交付镜像。可交付镜像在 gates 全绿后才构建。

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  OPENSPEC_VERSION: "1.13.1"
  UV_VERSION: "0.13.5"

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装 uv 与 OpenSpec
        run: |
          curl -LsSf https://astral.sh/uv/${{ env.UV_VERSION }}/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm install -g @fission-ai/openspec@${{ env.OPENSPEC_VERSION }}
      - name: 准备依赖
        run: |
          uv sync --project backend --locked
          npm --prefix frontend ci
      - name: 运行全量门禁
        run: make check
      - name: 归档门禁记录
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-check
          path: reports/lesson-10/**
          if-no-files-found: warn
          retention-days: 14

  security:
    name: make check-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装 uv 与 OpenSpec
        run: |
          curl -LsSf https://astral.sh/uv/${{ env.UV_VERSION }}/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm install -g @fission-ai/openspec@${{ env.OPENSPEC_VERSION }}
      - name: 准备依赖
        run: |
          uv sync --project backend --locked
          npm --prefix frontend ci
      - name: 生成一次性测试环境（不入库）
        run: |
          python - <<'PY'
          import secrets, pathlib, subprocess
          fernet = subprocess.run(
              ["backend/.venv/bin/python", "-c",
               "from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())"],
              capture_output=True, text=True, check=True).stdout.strip()
          pathlib.Path(".env").write_text(
              "JWT_SECRET_KEY=%s\n" % secrets.token_urlsafe(48)
              + "GRADING_BROKER_PASSWORD=%s\n" % secrets.token_urlsafe(24)
              + "MCP_AUTH_TOKEN=%s\n" % secrets.token_hex(32)
              + "MCP_TOKEN_KEY=%s\n" % fernet
              + "CAMPUSCLAW_PORT=8080\n"
              + "CAMPUSCLAW_DATA_DIR=./data/current\n"
              + "DEEPSEEK_API_KEY=\n",
              encoding="utf-8",
          )
          PY
      - name: 写入四个演示身份（临时核查库）
        env:
          DATABASE_URL: sqlite:///./data/current/campusclaw.db
          JWT_SECRET_KEY: ci-seed-only-jwt-secret-000000000000000000
        run: |
          mkdir -p data/current
          backend/.venv/bin/python - <<'PY'
          import sys
          sys.path.insert(0, "backend")
          from database import Base, SessionLocal, engine
          from models import Class, User, Role
          from security import hash_password

          Base.metadata.create_all(engine)
          identities = [
              ("TEA001", Role.teacher, None, "math", "[101,102]", 101),
              ("TEA002", Role.teacher, None, "physics", "[101,102]", 102),
              ("20260001", Role.student, 101, None, None, None),
              ("20260002", Role.student, 102, None, None, None),
          ]
          with SessionLocal() as db:
              for cid, name in ((101, "合成A班"), (102, "合成B班")):
                  if not db.get(Class, cid):
                      db.add(Class(id=cid, name=name))
              db.flush()
              for ident, role, cid, subject, classes, head in identities:
                  if not db.query(User).filter(User.identifier == ident).first():
                      db.add(User(identifier=ident, name=ident, role=role, class_id=cid,
                                  subject=subject, teaching_classes=classes,
                                  homeroom_class_id=head, password_hash=hash_password("Test@2026"),
                                  must_change_password=False))
              db.commit()
          PY
      - name: 启动测试栈（仅用于密钥扫描范围）
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null; then exit 0; fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=100
          exit 1
      - name: 运行安全门禁
        run: make check-security
      - name: 归档安全证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-security
          path: reports/security-evidence/**
          if-no-files-found: warn
          retention-days: 14
      - name: 清理测试栈
        if: always()
        run: docker compose down -v --remove-orphans

  images:
    name: build-and-scan
    needs: [check, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 记录实际提交
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: 生成一次性构建环境（不入库）
        # docker-compose.yml 对 JWT_SECRET_KEY / GRADING_BROKER_PASSWORD 用 :? 强校验，
        # 缺 .env 时 `docker compose build` 会在插值阶段直接失败；这里只提供构建期占位值。
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, secrets
          pathlib.Path(".env").write_text(
              "JWT_SECRET_KEY=%s\n" % secrets.token_urlsafe(48)
              + "GRADING_BROKER_PASSWORD=%s\n" % secrets.token_urlsafe(24)
              + "MCP_AUTH_TOKEN=%s\n" % secrets.token_hex(32)
              + "MCP_TOKEN_KEY=%s\n" % base64.urlsafe_b64encode(os.urandom(32)).decode()
              + "CAMPUSCLAW_PORT=8080\n"
              + "CAMPUSCLAW_DATA_DIR=./data/current\n"
              + "DEEPSEEK_API_KEY=\n",
              encoding="utf-8",
          )
          PY
      - name: 构建三个应用镜像
        run: |
          GIT_SHA="${{ steps.rev.outputs.sha }}" docker compose build backend frontend mcp-tools
      - name: 记录镜像摘要与 revision
        run: |
          mkdir -p reports/lesson-10/ci
          for svc in backend frontend mcp-tools; do
            image="campusclaw-${svc}:${{ steps.rev.outputs.sha }}"
            docker image inspect "$image" --format '{{.Id}} {{json .Config.Labels}}' \
              | tee "reports/lesson-10/ci/${svc}-image.txt"
          done
      # 三次扫描都跑完再判定：单个镜像红不再掩盖其余镜像的结果。
      # 扫描只出报告（exit-code 0），判定交给 scripts/trivy_os_gate.py：
      # CRITICAL 一票否决；HIGH 必须有修复版本或未过期的书面例外。
      - name: 扫描后端镜像（出报告，不判定）
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: campusclaw-backend:${{ steps.rev.outputs.sha }}
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: json
          output: reports/lesson-10/ci/trivy-backend.json
      - name: 扫描前端镜像（出报告，不判定）
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: campusclaw-frontend:${{ steps.rev.outputs.sha }}
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: json
          output: reports/lesson-10/ci/trivy-frontend.json
      - name: 扫描 MCP 工具镜像（出报告，不判定）
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: campusclaw-mcp-tools:${{ steps.rev.outputs.sha }}
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: json
          output: reports/lesson-10/ci/trivy-mcp-tools.json
      - name: OS 层漏洞门禁（CRITICAL 一票否决，HIGH 按书面例外）
        run: |
          python3 scripts/trivy_os_gate.py reports/lesson-10/ci/trivy-*.json \
            | tee reports/lesson-10/ci/os-vuln-gate.txt
      - name: 归档镜像证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: images
          path: reports/lesson-10/ci/**
          if-no-files-found: warn
          retention-days: 14
