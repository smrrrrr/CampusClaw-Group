name: campusclaw-group

services:
  # 唯一对外入口：根目录 .env 可用 CAMPUSCLAW_PORT 调整端口
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${CAMPUSCLAW_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped

  # 自建 MCP 工具服务：仅在 Compose 内网暴露 8090，不映射宿主机端口。
  # 后端不 depends_on 它，工具服务不可用不影响主应用启动与普通问答。
  mcp-tools:
    build:
      context: ./mcp-server
    expose:
      - "8090"
    environment:
      # 与后端共享的访问令牌；为空时服务拒绝所有 /mcp 请求
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    # 仅 Docker 内网可达，宿主机/外网无法直连 8000
    expose:
      - "8000"
    environment: &backend-env
      # SQLite 落在挂载卷内，容器重建数据不丢
      DATABASE_URL: sqlite:////app/data/campusclaw.db
      # Windows 主机共享目录不使用 WAL 的共享内存；Linux 原生存储可显式改为 WAL。
      SQLITE_JOURNAL_MODE: ${SQLITE_JOURNAL_MODE:-DELETE}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?请在根目录 .env 中设置 JWT_SECRET_KEY}
      # 交互式 API 文档：默认关闭，本地调试可在 .env 置 ENABLE_DOCS=true
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      FRONTEND_ORIGINS: http://localhost:${CAMPUSCLAW_PORT:-8080},http://127.0.0.1:${CAMPUSCLAW_PORT:-8080}
      # AI 解题助手 DeepSeek Key（从根目录 .env 读取，不硬编码）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # 可切换到 openai 兼容网关（如课程网关）；留空沿用后端默认的 DeepSeek 官方地址与模型
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      # MCP：与 mcp-tools 共享的令牌 + 加密教师令牌用的服务端密钥 + SSRF 允许清单
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      MCP_TOKEN_KEY: ${MCP_TOKEN_KEY:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-mcp-tools:8090}
      # /api/health 探测自建工具服务连通性（2 秒超时，只报 ok/unreachable，不回显地址）
      MCP_TOOLS_HEALTH_URL: http://mcp-tools:8090/health
      GRADING_BROKER_HOST: rabbitmq
      GRADING_BROKER_USER: ${GRADING_BROKER_USER:-campusclaw}
      GRADING_BROKER_PASSWORD: ${GRADING_BROKER_PASSWORD:?请在根目录 .env 设置队列密码}
      GRADING_MAX_ATTEMPTS: ${GRADING_MAX_ATTEMPTS:-3}
      GRADING_RETRY_BASE_SECONDS: ${GRADING_RETRY_BASE_SECONDS:-5}
      GRADING_LEASE_SECONDS: ${GRADING_LEASE_SECONDS:-180}
      GRADING_POLL_SECONDS: ${GRADING_POLL_SECONDS:-1}
    volumes: &backend-volumes
      # 材料文件本体持久化（与本地开发 backend/uploads 同源）
      - ./backend/uploads:/app/uploads
      # SQLite 数据文件持久化
      - ${CAMPUSCLAW_DATA_DIR:-./data}:/app/data
    # 用 venv 内 uvicorn 直跑，避免 `uv run` 启动时联网解析依赖（国内网络易超时）
    command: ["/app/.venv/bin/uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  # 仅内部访问；队列和消息持久化，不映射管理界面到宿主机。
  rabbitmq:
    image: rabbitmq:4.2-management@sha256:4e1c1636957aa13c2dbeb8c92606891ac0c396999bb4d7c3a7e3ba38430df7fa
    hostname: grading-broker
    environment:
      RABBITMQ_DEFAULT_USER: ${GRADING_BROKER_USER:-campusclaw}
      RABBITMQ_DEFAULT_PASS: ${GRADING_BROKER_PASSWORD:?请在根目录 .env 设置队列密码}
    volumes:
      - grading-broker:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  grading-worker: &grading-worker
    build:
      context: ./backend
    environment: *backend-env
    volumes: *backend-volumes
    command: ["/app/.venv/bin/python", "grading_worker.py", "--mode", "consume"]
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    stop_grace_period: 90s
    restart: unless-stopped

  grading-dispatcher:
    <<: *grading-worker
    command: ["/app/.venv/bin/python", "grading_worker.py", "--mode", "dispatch"]

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    # 仅 Docker 内网可达，由 nginx 反代
    expose:
      - "3000"
    environment:
      # Next.js rewrites 的反代目标（容器内 localhost 不通，须指向服务名）
      BACKEND_INTERNAL_URL: http://backend:8000
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 15s
    restart: unless-stopped

volumes:
  grading-broker:
